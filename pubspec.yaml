name: bearings
publish_to: none
environment:
  sdk: ^3.13.0

hooks:
  user_defines:
    win32:
      local_build: true

workspace:
  - apps/beariscope
  - apps/bearimetric
  - packages/core
  - packages/services
  - packages/ui
  - backend/honeycomb

dev_dependencies:
  build_runner: 2.15.1
  image: 4.3.0
  melos: 7.8.1

melos:
  packages:
    - apps/beariscope
    - apps/bearimetric
    - packages/core
    - packages/services
    - packages/ui
    - backend/honeycomb

  scripts:
    format:
      description: Apply formatting across the workspace.
      run: dart format apps packages backend tool

    format:check:
      description: Check formatting across the workspace.
      run: dart format --output=none --set-exit-if-changed apps packages backend tool

    icons:
      description: Generate application icons for every platform.
      run: dart run tool/generate_icons.dart

    icons:check:
      description: Check that generated application icons are current.
      run: dart run tool/generate_icons.dart --check

    analyze:
      description: Run static analysis in every package.
      run: melos exec --fail-fast -- "dart analyze . --no-fatal-warnings"

    test:dart:
      description: Run tests for pure Dart packages.
      run: melos exec --scope=core --scope=honeycomb --dir-exists=test --fail-fast -- "dart test"

    test:flutter:
      description: Run tests for Flutter packages and apps.
      run: melos exec -c 1 --flutter --dir-exists=test --fail-fast -- "flutter test"

    test:
      description: Run every workspace test suite.
      steps:
        - melos run test:dart
        - melos run test:flutter

    generate:
      description: Run build_runner where it is declared.
      run: melos exec --depends-on=build_runner --fail-fast -- "dart run build_runner build --delete-conflicting-outputs"

    ci:
      description: Run the full validation suite used in CI.
      steps:
        - dart pub get
        - melos run format:check
        - melos run analyze
        - melos run test
