name: Bearings CI

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: bearings-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: commitlint.config.cjs

  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate App Token
        if: github.event_name == 'pull_request'
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.BEARITONE_APP_ID }}
          private-key: ${{ secrets.BEARITONE_APP_KEY }}

      - name: Get Bearitone User ID
        if: github.event_name == 'pull_request'
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          ref: ${{ github.head_ref || '' }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Melos
        run: dart pub global activate melos

      - name: Install dependencies
        run: dart pub get

      - name: Run dart fix
        run: melos exec -- "dart fix --apply"

      - name: Run dart format
        run: melos run format

      - name: Commit formatting changes
        if: github.event_name == 'pull_request'
        run: |
          git config --local user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config --local user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'
          
          git add -A
          git diff --staged --quiet || git commit -m "chore(repo): apply dart format and dart fix"

      - name: Push formatting changes
        if: github.event_name == 'pull_request'
        run: git push origin HEAD:${{ github.head_ref }}

      - name: Validate workspace
        run: melos run ci
